<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusGhost Admin Login</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><div><div class="eyebrow">RESTRICTED ACCESS</div><h1>CampusGhost Admin Portal</h1></div></header><main class="container narrow"><section class="admin-panel"><p class="eyebrow">ADMINISTRATOR AUTHENTICATION</p><h2>Secure sign in</h2><p class="muted">Only authorised administrators can compare identity mappings and review or revoke flagged permissions.</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" required value="admin"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="loginError" class="error" aria-live="polite"></p></form><a href="/">Return to investigation dashboard</a></section></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(r.ok)location.href=d.redirect;else document.getElementById('loginError').textContent=d.error||'Login failed';});</script></body></html>
